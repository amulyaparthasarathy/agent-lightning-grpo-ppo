[project]
name = "agent-lightning-lab"
version = "0.1.0"
description = "Local Modal client and CPU utilities for the Agent Lightning course experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal==1.6.3",
    "huggingface-hub>=0.36,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
reader-test = [
    "pyarrow==25.0.1",
]
