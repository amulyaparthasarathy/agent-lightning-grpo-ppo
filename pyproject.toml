[project]
name = "agent-lightning-lab"
version = "0.1.0"
description = "Local Modal client and CPU utilities for the Agent Lightning course experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal==1.6.3",
    "huggingface-hub>=0.36,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
reader-test = [
    "pyarrow==25.0.1",
]

# CPU-only real transport/harness tests; CUDA/vLLM are never installed here.
reader-harness = [
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai,mcp]==0.7.5",
    "mcp==1.26.0",
    "mcp-server-calculator==0.2.1",
    "openai==2.54.0",
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    # Effective-prompt inspection: the versions recorded in the training image.
    # The gated tokenizer file itself is never installed or downloaded here.
    "jinja2==3.1.6",
    "tokenizers==0.23.3",
]
tinker = [
    "tinker==0.40.1",
]
